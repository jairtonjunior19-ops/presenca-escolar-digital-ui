<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alunos - Sistema de Presença Escolar</title>
    <link rel="stylesheet" href="gestor.css">
</head>
<body>

    <div id="menu-gestor"></div>

    <main class="container-principal">
        <div class="cabecalho-pagina">
            <div>
                <h1>Alunos</h1>
                <p class="subtitulo-pagina">Cadastro de alunos da escola</p>
            </div>
            <button class="botao-primario" onclick="abrirModalAluno()">+ Novo Aluno</button>
        </div>

        <section class="caixa-painel">
            <div class="wrapper-tabela">
                <table class="tabela-dados">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Matrícula</th>
                            <th>Turma</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="linhas-alunos-gestor"></tbody>
                </table>
            </div>
            <p class="mensagem-vazia" id="mensagem-vazia-alunos-gestor" hidden>Nenhum aluno cadastrado.</p>
        </section>
    </main>

    <div class="sobreposicao-modal" id="modal-aluno" hidden>
        <div class="caixa-modal">
            <h2 id="titulo-modal-aluno">Novo Aluno</h2>
            <div class="mensagem-erro-formulario" id="erro-formulario-aluno" hidden></div>
            <form id="formulario-aluno">
                <input type="hidden" id="id-aluno-edicao">
                <div class="grupo-campo">
                    <label for="nome-aluno">Nome Completo</label>
                    <input type="text" id="nome-aluno" class="campo-entrada" required>
                </div>
                <div class="grupo-campo">
                    <label for="matricula-aluno">Matrícula</label>
                    <input type="text" id="matricula-aluno" class="campo-entrada" required>
                </div>
                <div class="acoes-modal">
                    <button type="button" class="botao-secundario" onclick="fecharModalAluno()">Cancelar</button>
                    <button type="submit" class="botao-primario">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../../assets/js/armazenamento.js"></script>
    <script src="../../assets/js/navegacao-gestor.js"></script>
    <script src="alunos.js"></script>
</body>
</html>
